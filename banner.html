<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soria Moria Banner</title>
<!-- crossorigin lets the image export embed these fonts -->
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<link href="themes.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0a0c;
    color: #ddd;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 16px;
    font-family: system-ui, sans-serif;
    font-size: 14px;
  }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .1em; color: #888; text-transform: uppercase; margin-bottom: 8px; }

  /* Toolbar (same look as the poster page) */
  .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .toolbar button, .toolbar a {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    border: 1px solid #3a3a44; border-radius: 999px;
    background: #1a1a20; color: #ddd; font: inherit; text-decoration: none; cursor: pointer;
  }
  .toolbar button:hover, .toolbar a:hover { border-color: #888; }
  .toolbar button[aria-pressed="true"] { border-color: #e0b468; color: #fff; }
  .toolbar .swatch { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 1px #fff3; }
  .toolbar .sep { width: 1px; background: #3a3a44; margin: 0 4px; }
  .toolbar .status { align-self: center; color: #aaa; min-width: 9em; }

  /* ================= BANNER =================
     Exported at exactly --w x --h pixels (Torn's faction banner slot). */
  .banner {
    --w: 400px;
    --h: 100px;
    position: relative;
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Cinzel', serif;
  }

  /* The painting, scaled so the lit castle sits on the right */
  .banner .scene {
    position: absolute;
    inset: 0;
    background: url('img/scene.png') no-repeat;
    background-size: 640px auto;              /* 1672x941 -> 640x360 */
    background-position: -158px -48px;        /* castle ~ (330, 52) */
    /* fade the left side out so the title sits on clean night sky */
    -webkit-mask: linear-gradient(90deg, transparent 18%, #000 62%);
            mask: linear-gradient(90deg, transparent 18%, #000 62%);
  }
  /* Theme tint + darkened top/bottom edges so it melts into Torn's dark panel */
  .banner .shade {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(transparent 55%, color-mix(in srgb, var(--shadow) 70%, transparent)),
      linear-gradient(90deg, color-mix(in srgb, var(--shadow) 55%, transparent) 30%, transparent 70%);
  }
  .banner .glow {
    position: absolute;
    left: 280px; top: 10px;
    width: 110px; height: 80px;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 35%, transparent), transparent);
    mix-blend-mode: screen;
  }

  .banner .title {
    position: absolute;
    left: 16px; top: 0; bottom: 0;
    width: 250px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2px;
  }
  .banner .kicker {
    display: flex; align-items: center; gap: 8px; width: 100%;
    font-size: 9px; font-weight: 700; letter-spacing: .4em;
    color: var(--accent);
    white-space: nowrap;
  }
  .banner .kicker::before, .banner .kicker::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent));
  }
  .banner .kicker::after { background: linear-gradient(90deg, var(--accent), transparent); }
  .banner h1 {
    font-family: 'Cinzel Decorative', serif;
    font-weight: 900;
    font-size: 31px;
    line-height: 1.15;
    white-space: nowrap;
    background: var(--metal);
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    filter: drop-shadow(0 1px 0 var(--shadow)) drop-shadow(0 2px 5px rgba(0,0,0,.8));
  }
  .banner .rule {
    width: 60%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  .banner .frame {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--edge) 70%, transparent);
    pointer-events: none;
  }

  /* ================= PREVIEWS ================= */
  .zoom { width: 800px; height: 200px; max-width: 100%; }
  .zoom .banner { transform: scale(2); transform-origin: 0 0; }
  @media (max-width: 832px) {
    .zoom { width: 400px; height: 100px; }
    .zoom .banner { transform: none; }
  }

  /* Rough mock of Torn's faction info box, to judge it at real size */
  .torn {
    width: 580px; max-width: 100%;
    background: #333; border-radius: 5px; overflow: hidden;
    font: 12px Arial, sans-serif; color: #ddd;
  }
  .torn header {
    padding: 6px 10px;
    background: linear-gradient(#555, #333);
    font-weight: bold; color: #fff;
  }
  .torn .body { display: flex; gap: 12px; padding: 10px; overflow-x: auto; }
  .torn ul { list-style: none; line-height: 1.5; flex: 0 0 auto; }
  .torn a { color: #69a8e0; text-decoration: none; }
</style>
</head>
<body>

<nav class="toolbar" aria-label="Banner controls">
  <button data-theme="night"><span class="swatch" style="background:#141a2e"></span>Night</button>
  <button data-theme="contrast"><span class="swatch" style="background:#ffcf7a"></span>High contrast</button>
  <button data-theme="ember"><span class="swatch" style="background:#5a2216"></span>Ember</button>
  <button data-theme="frost"><span class="swatch" style="background:#8aa6bb"></span>Frost</button>
  <button data-theme="forest"><span class="swatch" style="background:#1b3125"></span>Forest</button>
  <span class="sep"></span>
  <button id="download">Download PNG (400×100)</button>
  <a href="./">Poster →</a>
  <span class="status" id="status" role="status"></span>
</nav>

<section>
  <h2>Preview (2×)</h2>
  <div class="zoom">
    <div class="banner themed" id="banner" data-theme="night" role="img" aria-label="Soria Moria — the Askelads">
      <div class="scene"></div>
      <div class="shade"></div>
      <div class="glow"></div>
      <div class="title">
        <div class="kicker">THE ASKELADS</div>
        <h1>Soria Moria</h1>
        <div class="rule"></div>
      </div>
      <div class="frame"></div>
    </div>
  </div>
</section>

<section>
  <h2>As it looks on Torn</h2>
  <div class="torn">
    <header>AskeLads - Soria Moria</header>
    <div class="body">
      <ul>
        <li>Leader: <a>SkjeggeLadd</a></li>
        <li>Co-leader: <a>MkuLadd</a></li>
        <li>Members: 22 / 40</li>
        <li>Best chain: 2,500</li>
        <li>Territories: 0</li>
        <li>Treaties: 0</li>
      </ul>
      <div id="mini"></div>
    </div>
  </div>
</section>

<script>
  const banner = document.getElementById('banner');
  const mini = document.getElementById('mini');
  const status = document.getElementById('status');
  const themeButtons = document.querySelectorAll('button[data-theme]');

  // Real-size copy for the Torn mock, kept in sync with the theme
  const copy = banner.cloneNode(true);
  copy.removeAttribute('id');
  mini.append(copy);

  // ---- theme switching (shared with the poster page) ----
  function setTheme(name) {
    banner.dataset.theme = copy.dataset.theme = name;
    themeButtons.forEach(b => b.setAttribute('aria-pressed', b.dataset.theme === name));
    try { localStorage.setItem('poster-theme', name); } catch {}
  }
  themeButtons.forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));
  let saved = null;
  try { saved = localStorage.getItem('poster-theme'); } catch {}
  setTheme(saved && document.querySelector(`button[data-theme="${saved}"]`) ? saved : 'night');

  // ---- export ----
  function say(text) { status.textContent = text; }

  async function download() {
    if (location.protocol === 'file:') {
      say('Open the page through a web server (e.g. GitHub Pages) to export it.');
      return;
    }
    say('Rendering…');
    try {
      // Export the un-zoomed copy at pixelRatio 1: exactly 400x100, as Torn requires
      const blob = await htmlToImage.toBlob(copy, { pixelRatio: 1 });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `soria-moria-banner-${copy.dataset.theme}.png`;
      a.click();
      URL.revokeObjectURL(a.href);
      say('Downloaded ✓');
    } catch (err) {
      say('Export failed, see console');
      console.error(err);
    }
  }
  document.getElementById('download').addEventListener('click', download);
</script>
</body>
</html>
